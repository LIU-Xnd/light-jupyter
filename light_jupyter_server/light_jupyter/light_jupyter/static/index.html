<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>light_jupyter</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <h1>light_jupyter</h1>
    <p class="sub">version <%= version %></p>
    <p id="gate-msg" class="msg"></p>
    <label>token</label>
    <input id="token-input" type="password" placeholder="paste token" autocomplete="off">
    <button id="gate-go">connect</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="bar">
    <span class="brand">light_jupyter</span>
    <span class="spacer"></span>
    <span id="info" class="info"></span>
    <span id="conn" class="pill">connecting…</span>
  </header>

  <main class="main">
    <section class="pane files">
      <div class="pane-head">
        <button id="up" title="parent dir">↑</button>
        <span id="cwd" class="cwd">/</span>
        <span class="spacer"></span>
        <button id="refresh">⟳</button>
        <button id="mkdir">+dir</button>
        <button id="upload">↑up</button>
      </div>
      <div id="listing" class="listing"></div>
    </section>

    <section class="pane editor">
      <div class="pane-head">
        <span id="open-name" class="cwd">(no file)</span>
        <span id="editor-mode" class="pill readonly">read-only</span>
        <span class="spacer"></span>
        <button id="edit-toggle" title="toggle edit mode">✎ edit</button>
        <button id="save" disabled>save</button>
        <button id="download">↓get</button>
        <button id="close-file" title="close">✕</button>
      </div>
      <textarea id="editor" spellcheck="false" readonly
                placeholder="click a file to open it (read-only) — press ✎ edit to modify"></textarea>
    </section>

    <section class="pane term">
      <div class="pane-head">
        <span class="cwd">terminal</span>
        <span class="spacer"></span>
        <button id="clear">clear</button>
      </div>
      <div id="term" class="term"></div>
      <!-- only shown in the no-xterm fallback; xterm has its own key handling -->
      <div id="keys" class="keys hidden">
        <button data-k="\u001b[A">↑</button>
        <button data-k="\u001b[B">↓</button>
        <button data-k="\u001b[C">→</button>
        <button data-k="\u001b[D">←</button>
        <button data-k="\u007f">⌫</button>
        <button data-k="\u0003">^C</button>
        <button data-k="\u0004">^D</button>
        <button data-k="\t">tab</button>
      </div>
    </section>
  </main>
</div>

<input id="filepick" type="file" hidden>


<script src="/static/vendor/xterm.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
